name: WeatherGPT CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ --cov=app --cov-report=xml
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          API_KEYS: test-key
          ANTHROPIC_API_KEY: ""
          OPENWEATHERMAP_API_KEY: ""
          WIS2_ENABLED: "false"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm run build

# Deploy is handled by Railway directly (auto-deploy on push to main via
# Railway's GitHub integration, or `railway up` from the CLI) — no separate
# Docker Hub push / webhook job needed here.
