<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WeatherGPT</title>
  <style>
    body { width: 340px; height: 460px; margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; background: #0f1720; color: #e8edf2; }
    header { padding: 0.6rem 0.75rem; font-weight: 600; border-bottom: 1px solid #223; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #7fd1c7; font-size: 0.75rem; text-decoration: none; }
    #messages { flex: 1; overflow-y: auto; padding: 0.6rem 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { padding: 0.5rem 0.65rem; border-radius: 10px; max-width: 85%; font-size: 0.85rem; line-height: 1.3; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: #1c6f68; }
    .msg.bot { align-self: flex-start; background: #1b2530; border: 1px solid #223; }
    .msg.error { color: #ff8a8a; }
    form { display: flex; gap: 0.4rem; padding: 0.6rem 0.75rem; border-top: 1px solid #223; }
    input { flex: 1; background: #1b2530; border: 1px solid #223; border-radius: 8px; color: inherit; padding: 0.45rem 0.6rem; font-size: 0.85rem; }
    button { background: #1c6f68; border: none; border-radius: 8px; color: #fff; padding: 0.45rem 0.8rem; font-size: 0.85rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    WeatherGPT
    <a href="options.html" target="_blank" id="settings-link">Settings</a>
  </header>
  <div id="messages"></div>
  <form id="chat-form">
    <input id="chat-text" type="text" placeholder="Ask about weather..." autocomplete="off" />
    <button type="submit" id="chat-send">Send</button>
  </form>
  <script src="popup.js"></script>
</body>
</html>
