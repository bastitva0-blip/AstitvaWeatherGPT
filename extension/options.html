<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WeatherGPT Chat — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #020B14; --bg-surface: #071A2B; --bg-elevated: #0D2640;
      --teal: #00D4AA; --text-primary: #E8F4F8; --text-muted: #4A6B82;
      --border-bright: #1A3D5C; --font-display: "Space Grotesk", sans-serif; --font-body: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { font-family: var(--font-body); max-width: 420px; margin: 2.5rem auto; color: var(--text-primary); background: var(--bg-deep); padding: 0 1.5rem; }
    h2 { font-family: var(--font-display); font-weight: 700; }
    label { display: block; margin-top: 1.1rem; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
    input {
      width: 100%; padding: 0.55rem 0.75rem; margin-top: 0.35rem; box-sizing: border-box;
      background: var(--bg-elevated); border: 1px solid var(--border-bright); border-radius: 10px; color: inherit; font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--teal); }
    button {
      margin-top: 1.4rem; padding: 0.55rem 1.2rem; cursor: pointer; background: var(--teal); border: none;
      border-radius: 999px; font-weight: 600; color: var(--bg-deep); font-family: inherit;
    }
    #status { margin-top: 0.75rem; font-size: 0.85rem; color: var(--teal); min-height: 1.2em; }
  </style>
</head>
<body>
  <h2>WeatherGPT Chat — Settings</h2>
  <label for="apiBase">Backend API URL</label>
  <input id="apiBase" type="text" placeholder="https://backend-production-c6aa1.up.railway.app" />
  <label for="apiKey">API Key</label>
  <input id="apiKey" type="text" placeholder="test-key" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
