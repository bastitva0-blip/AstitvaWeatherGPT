apiVersion: apps/v1
kind: Deployment
metadata:
  name: weathergpt-backend
  labels:
    app: weathergpt-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: weathergpt-backend
  template:
    metadata:
      labels:
        app: weathergpt-backend
    spec:
      containers:
        - name: fastapi
          image: weathergpt/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: weathergpt-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: weathergpt-backend-svc
spec:
  selector:
    app: weathergpt-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: weathergpt-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weathergpt-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
